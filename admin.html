<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Maruu de' Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Menu -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">Maruu de' Shop</a>
            <div class="nav-link">
                <a href="index.html">Home</a>
                <a href="shop.html" class="btn-primary">Browse Products</a>
                <a href="admin.html" class="btn-secondary" style="color: var(--primary-color);">Admin Portal</a>
            </div>
        </div>
    </nav>

    <nav class="mobile-navbar">
        <div class="mobile-nav-container">
                <a href="index.html">Home</a>
                <a href="shop.html" class="btn-primary">Browse Products</a>
                <a href="admin.html" class="btn-secondary" style="color: var(--primary-color);">Admin Portal</a>
        </div>
    </nav>

    <main class="shop-section">
        <h2 class="section-title">Admin Product Management</h2>
        
        <!-- Login Section -->
        <div id="login-section" style="text-align: center; margin-top: 3rem;">
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Restricted Access: Authorized Personnel Only.</p>
            <button id="google-login-btn" class="btn-full" style="max-width: 300px; margin: 0 auto; display: block;">Login with Google</button>
        </div>

        <!-- Admin Dashboard (Hidden by default) -->
        <div id="admin-dashboard" style="display: none;">
            <h3 class="model-subtitle" style="text-align: left; margin-bottom: 1rem;">Add New Product</h3>
            <form id="add-product-form" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 4rem; max-width: 600px;">
                <input type="text" id="p-id" placeholder="Product ID (e.g. 17-pro-clear)" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="text" id="p-name" placeholder="Product Name" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="text" id="p-desc" placeholder="Description" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="number" id="p-price" placeholder="Price (RM)" step="0.01" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="number" id="p-stock" placeholder="Stock Count" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="text" id="p-image" placeholder="Image URL" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="text" id="p-category" placeholder="Category ID (e.g. iPhone17)" required class="form-group input" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px;">
                <button type="submit" class="btn-full" style="max-width: 200px;">Save Product</button>
            </form>

            <h3 class="model-subtitle" style="text-align: left; margin-bottom: 1rem;">Existing Inventory</h3>
            <!-- Utilizes your exact product grid layout -->
            <div id="admin-product-list" class="product-grid"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 Maruu de' Shop. Serving PMU locally.
    </footer>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDQ7T8Lz1CtbJOgGp-DX5HtmQY814lWQ6U",
            authDomain: "maruu-de--shop.firebaseapp.com",
            projectId: "maruu-de--shop",
            storageBucket: "maruu-de--shop.firebasestorage.app",
            messagingSenderId: "948084838634",
            appId: "1:948084838634:web:941c44687e96b508494793",
            measurementId: "G-371J2BPF4C"   
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const allowedEmail = "georgeschan93@gmail.com";

        const loginBtn = document.getElementById('google-login-btn');
        const loginSection = document.getElementById('login-section');
        const adminDashboard = document.getElementById('admin-dashboard');

        // Handle Google Login Popup
        loginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                
                if (user.email !== allowedEmail) {
                    alert("Access Denied: You are not authorized as an admin.");
                    auth.signOut();
                }
            } catch (error) {
                console.error("Login failed", error);
            }
        });

        // Monitor Login State
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === allowedEmail) {
                loginSection.style.display = 'none';
                adminDashboard.style.display = 'block';
                loadAdminProducts();
            } else {
                loginSection.style.display = 'block';
                adminDashboard.style.display = 'none';
            }
        });

        // Add or Update Product in Firestore
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value.trim();
            const name = document.getElementById('p-name').value.trim();
            const description = document.getElementById('p-desc').value.trim();
            const price = parseFloat(document.getElementById('p-price').value);
            const stock = parseInt(document.getElementById('p-stock').value);
            const image = document.getElementById('p-image').value.trim();
            const category = document.getElementById('p-category').value.trim();

            await setDoc(doc(db, "products", id), { name, description, price, stock, image, category });
            alert("Product saved successfully!");
            document.getElementById('add-product-form').reset();
            loadAdminProducts();
        });

        // Load Products into Admin View (Styled like main shop)
        async function loadAdminProducts() {
            const listEl = document.getElementById('admin-product-list');
            listEl.innerHTML = '<p>Loading database...</p>';
            const querySnapshot = await getDocs(collection(db, "products"));
            
            listEl.innerHTML = '';
            querySnapshot.forEach((documentSnapshot) => {
                const prodId = documentSnapshot.id;
                const data = documentSnapshot.data();
                
                listEl.innerHTML += `
                    <div class="product-card">
                        <img src="${data.image}" alt="${data.name}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-title">${data.name}</h3>
                            <p class="product-description" style="font-size: 0.8rem; color: #888;">Category: ${data.category} | ID: ${prodId}</p>
                            <div class="product-footer" style="margin-top: 1rem;">
                                <div>
                                    <span class="product-price" style="display:block; font-size:1rem;">RM${parseFloat(data.price).toFixed(2)}</span>
                                    <span style="font-size:0.85rem; color: ${data.stock > 0 ? 'var(--primary-color)' : '#ef4444'};">Stock: ${data.stock}</span>
                                </div>
                                <button onclick="deleteProduct('${prodId}')" style="background:#ef4444; color:white; border:none; padding:0.5rem 1rem; border-radius:6px; font-weight:bold; cursor:pointer;">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Global Delete Function attached to window for inline onclick execution
        window.deleteProduct = async function(id) {
            if (confirm("Are you sure you want to delete this product from the database?")) {
                await deleteDoc(doc(db, "products", id));
                loadAdminProducts();
            }
        }
    </script>
</body>
</html>
